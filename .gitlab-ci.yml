# Docker Image location on hub.docker.com, its normally your-username/repo-name
image: node:alpine
# pipeline will use this image unless specifed in the stage definition
# Define the stages
stages:
  - build
  - deploy
# Define the process for each stage
build:
  stage: build
  script:
    - apk add zip
    - npm install
    - npm run build
    - ls -la build
    - zip build.zip -r ./build
  artifacts:
    paths:
    - build.zip
deployssh:
  image: alpine
  stage: deploy
  script:
    - apk update
    - apk add openssh
# Install the SSH keys
    - mkdir ~/.ssh
    - echo "$ID_RSA" >> ~/.ssh/id_rsa
    - echo "$ID_RSA_PUB" >> ~/.ssh/id_rsa.pub
    - chmod 600 ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa.pub
# Start the ssh daemon and add the private key
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - cat ~/.ssh/id_rsa.pub > ~/.ssh/authorized_keys
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
# Execute a remote command
    - scp build.zip deploy@34.123.13.63:/tmp/build.zip
    - ssh deploy@34.123.13.63 "unzip /tmp/build.zip && exit"
  