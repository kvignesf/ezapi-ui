# Docker Image location on hub.docker.com, its normally your-username/repo-name
image: node:alpine
# pipeline will use this image unless specifed in the stage definition
# Define the stages
stages:
  - build
  - deploy
# Define the process for each stage
build:
  stage: build
  script:
    - apk add zip
    - npm install
    - npm run build
    - ls -la build
    - zip build.zip -r ./build
  artifacts:
    paths:
    - build.zip
deploy:
  image: ubuntu:latest
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client git -y )'
    -  eval $(ssh-agent -s)
    -  echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
    -  mkdir -p ~/.ssh
    -  chmod 700 ~/.ssh
    -  ssh-keyscan 34.123.13.63 >> ~/.ssh/known_hosts
    -  chmod 644 ~/.ssh/known_hosts
  stage: deploy 
  script:
    - ssh deploy@34.123.13.63
      