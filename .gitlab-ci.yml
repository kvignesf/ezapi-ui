image: node:alpine
include:
  project: 'ezapi_poc/infra_poc'
  file: 
    - 'reactuici.yaml'
    - 'deploy-reactui-demo-1.yaml'
    - 'deploy-reactui-instance-1.yaml'
stages:
  - build
  - deploy-demo1
  - deploy-instance1 
build:
  stage: build 
  extends: .build
deploy-demo1:  
  stage: deploy-demo1
  image: alpine  
  extends: .deploy-demo1
  except:
    - master
deploy-instance1:
  stage: deploy-instance1
  image: alpine  
  extends: .deploy-instance1
  only: 
    - master   

      
