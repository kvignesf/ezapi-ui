# Docker Image location on hub.docker.com, its normally your-username/repo-name
image: node:alpine
# pipeline will use this image unless specifed in the stage definition
# Define the stages
stages:
  - build
  - deploy
# Define the process for each stage
build:
  stage: build
  script:
    - apk add zip
    - npm install
    - npm run build
    - ls -la build
    - zip build.zip -r ./build
  artifacts:
    paths:
    - build.zip
deploy:
  image: ubuntu:latest
  before_script:
    - mkdir -p ~/.ssh
    - echo "$ID_RSA" >> ~/.ssh/id_rsa
    - echo "$ID_RSA_PUB" >> ~/.ssh/id_rsa.pub
    - chmod 600 ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa.pub
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client git -y )'
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa
  stage: deploy 
  script:
    - scp build.zip deploy@34.123.13.63:/tmp/build.zip
      