# Docker Image location on hub.docker.com, its normally your-username/repo-name
image: node:alpine
# pipeline will use this image unless specifed in the stage definition
# Define the stages
stages:
  - build
  - deploy
# Define the process for each stage
build:
  stage: build
  script:
    - apk add zip
    - npm install
    - npm run build
    - ls -la build
    - zip build.zip -r ./build
  artifacts:
    paths:
    - build.zip
deploy:
  image: ubuntu:latest
  before_script:
  - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
  -  ssh-add <(cat $ID_RSA)
  -  echo "$ID_RSA" | tr -d '\r' > ~/.ssh/id_rsa
  -  chmod 700 ~/.ssh
  -  eval "$(ssh-agent -s)"
  -  ssh-add ~/.ssh/id_rsa
  -  ssh-keyscan -t rsa 34.123.13.63 >> ~/.ssh/known_hosts
  -  echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  -  chmod 644 ~/.ssh/known_hosts
  stage: deploy 
  script:
    - scp build.zip deploy@34.123.13.63:/tmp/build.zip
      