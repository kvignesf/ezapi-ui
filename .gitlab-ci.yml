# Docker Image location on hub.docker.com, its normally your-username/repo-name
image: node:alpine
# pipeline will use this image unless specifed in the stage definition
# Define the stages
stages:
  - build
  - deploy
# Define the process for each stage
build:
  stage: build
  script:
    - apk add zip
    - npm install
    - npm run build
    - ls -la build
    - zip build.zip -r ./build
  artifacts:
    paths:
    - build.zip
deploy:
  image: ubuntu:latest
  before_script:
    - mkdir -p ~/.ssh     
    - mv "$DEPLOY_KEY" ~/.ssh/id_rsa 
    - chmod 600 ~/.ssh/id_rsa
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client git -y )'
    -  eval "$(ssh-agent -s)"
    -  cat ~/.ssh/id_rsa.pub > /home/deploy/.ssh/authorized_keys
    -  ssh-add ~/.ssh/id_rsa
    -  ssh-keyscan -H '34.123.13.63' >> /home/deploy/.ssh/known_hosts     
  stage: deploy 
  script:
    - scp build.zip deploy@34.123.13.63:/tmp/build.zip
      