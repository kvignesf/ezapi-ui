image: node:alpine
include:
  project: 'ezapi_poc/infra_poc'
  file: 
    - 'reactuicidev.yaml'
    - 'reactuiciprod.yaml'
    - 'deploy-reactui-test-1.yaml'
    - 'deploy-reactui-demo-1.yaml'
    - 'deploy-reactui-instance-1.yaml'
stages:
  - build-dev
  - build-prod 
  - deploy-demo1
  - deploy-instance1 
build-dev:
  stage: build-dev 
  extends: .build-dev
  except:
    - master
build-prod:
  stage: build-prod
  extends: .build-prod
  only:
    - master    
deploy-test1:
  stage: deploy-test1
  image: alpine  
  extends: .deploy-test1
  only: 
    - test    
deploy-demo1:  
  stage: deploy-demo1
  image: alpine  
  extends: .deploy-demo1
  only:
    - master
deploy-instance1:
  stage: deploy-instance1
  image: alpine  
  extends: .deploy-instance1
  only: 
    - stage       
