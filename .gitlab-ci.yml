# Docker Image location on hub.docker.com, its normally your-username/repo-name
image: node:alpine
# pipeline will use this image unless specifed in the stage definition
# Define the stages
stages:
  - build
  - deploy
# Define the process for each stage
build:
  stage: build
  script:
    - apk add zip
    - npm install
    - npm run build
    - ls -la build
    - zip build.zip -r ./build
  artifacts:
    paths:
    - build.zip
deploy:
  stage: deploy
    image: ubuntu:latest
before_script:
  # Setup SSH
     mkdir -p ~/.ssh
	- echo -e "$DEPLOY_KEY" > ~/.ssh/id_rsa
	- chmod 600 ~/.ssh/id_rsa
	- '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    # Copy files and execute commands
    - scp build.zip jvenkatakrishnan@34.123.13.63:/tmp/build.zip
    - ssh jvenkatakrishnan@34.123.13.63 "unzip /tmp/build.zip && exit"
    - ssh jvenkatakrishnan@34.123.13.63 "mv /tmp/build /var/www/ && exit"
    - ssh jvenkatakrishnan@34.123.13.63 "systemctl restart nginx"
